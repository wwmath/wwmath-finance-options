# Source papers for the Math AST library.
#
# PDFs are NOT committed (most are copyrighted). Download them by hand into
# research/pdfs/<id>.pdf (git-ignored). `pdf` links are direct downloads where
# one exists; `landing` is the publisher/abstract page.
#
# access: "open" = free to download, "subscription" = publisher paywall
# (try your institution or the author's page), "free-registration" = SSRN login.

[[papers]]
id = "bachelier1900"
title = "Théorie de la spéculation"
authors = ["Louis Bachelier"]
year = 1900
venue = "Annales scientifiques de l'École Normale Supérieure, Série 3"
volume = "17"
pages = "21-86"
doi = "10.24033/asens.476"
landing = "https://www.numdam.org/item/ASENS_1900_3_17__21_0/"
pdf = "https://www.numdam.org/article/ASENS_1900_3_17__21_0.pdf"
mirrors = ["http://eudml.org/doc/81146"]
access = "open"
notes = "Public domain. English translation: Cootner (ed.), The Random Character of Stock Market Prices, MIT Press 1964, pp. 17-78; also Davis & Etheridge, Louis Bachelier's Theory of Speculation, Princeton UP 2006."
role = "Arithmetic (normal) Brownian dynamics; the Bachelier option price."

[[papers]]
id = "black1976"
