[[papers]]
id = "andreasen2011"
title = "ZABR -- Expansions for the Masses"
authors = ["Jesper Andreasen", "Brian Norsk Huge"]
year = 2011
venue = "SSRN working paper 1980726"
doi = "10.2139/ssrn.1980726"
landing = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1980726"
access = "free-registration"
notes = "The original ZABR paper (Dec 2011). The '2015' ZABR reference is Caspers' implementation note below."
role = "SABR generalised with a CEV power gamma on the volatility."

[[papers]]
