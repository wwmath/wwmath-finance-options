      "args": [{"op": "Symbol", "name": "x"}, {"op": "Symbol", "name": "t"}]
    },
    {
      "op": "Mul",
      "args": [
        {
          "op": "Div",
          "args": [
            {"op": "Number", "value": 1},
            {
              "op": "Mul",
              "args": [
                {"op": "Number", "value": 2},
                {"op": "Constant", "name": "pi"},
                {"op": "Symbol", "name": "k"},
                {"op": "Sqrt", "args": [{"op": "Symbol", "name": "t"}]}
              ]
            }
          ]
        },
        {
          "op": "Call",
          "fn": "exp",
          "args": [
            {
              "op": "Neg",
              "args": [
                {
                  "op": "Div",
                  "args": [
                    {
                      "op": "Pow",
                      "args": [{"op": "Symbol", "name": "x"}, {"op": "Number", "value": 2}]
                    },
                    {
                      "op": "Mul",
                      "args": [
                        {"op": "Number", "value": 4},
                        {"op": "Constant", "name": "pi"},
                        {
                          "op": "Pow",
                          "args": [{"op": "Symbol", "name": "k"}, {"op": "Number", "value": 2}]
                        },
                        {"op": "Symbol", "name": "t"}
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
'''

