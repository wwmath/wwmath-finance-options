[package]
name = "conformance-host"
version = "0.1.0"
edition = "2021"
description = "Browser host/orchestrator for the cross-language Heston WASM conformance harness"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

[profile.release]
opt-level = 3
lto = true
